contracts: ["Accepted base is main a5badfd6c448c549e8bf1119041006b514cdb8cd, tree bbf1c39780d0a11c684c332c283202f9e5fc25dd, holding195 immutable packets including MET-PERF-030, merged through the owner-operated required verify check. Add MET-LINUX-006 only for196. Preserve all195 predecessor YAML, existing authority/index/source-lock bytes and historical attempt records. One packet, branch and PR.","Measured cause: an owner-approved GCP Linux run (deleted afterwards) reported six Linux-only failures. Reproduction in an Ubuntu24.04 container showed: ci/test_warm_snapshot.py and tests/test_reuse.py (which reuses the same test class) created their fixture under /private/tmp, which exists only on macOS; three Linux runner kit tests failed only because that run used root, and the kit correctly refuses root (they pass as a non-root user, as the verifier runs); the predecessor test failed only because of the first two. A non-root Linux run then showed six tests/linux_runner/test_system_inventory_v2.py cases failing only because Ubuntu gives ordinary users umask 002, so the synthetic fixture's files were group-writable and its non-writable predicate refused them.","Change only the warm-snapshot fixture parent (/private/tmp when that directory exists, else /tmp; neither is under HOME or the checkout, so the locker's forbidden-root checks keep their meaning) and set umask 022 for the duration of the synthetic system-inventory fixture. Production's root-only predicate and the kit's refusal to run as root are unchanged; macOS behaviour is unchanged. The new layer's test routes also cover the top-level ci/test_ files it changes.","Add one196-packet current catalog with an exact196-to-195 inverse before the accepted195-to-194 MET-PERF-030 layer, composed linearly (every newer authority freshly read exactly once per route). The new projection imports no predecessor validator and rechecks its whole authority on every public route. Historical source is data and never executed.","Inherit every MET-PERF-030 direct-argv command in order and add one validator before outer pytest:58 commands. Identical offline wrapper/environment, no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep nested420/local750/trusted900/workflow15min and32MiB outer output ceiling. The only ci/ change is the top-level test file ci/test_warm_snapshot.py, which the owner-operated verifier admits.","Inherited validators, tests and documents change only by: mechanical196-packet membership/count updates; the YAML corpus count211-to-212 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-LINUX-006 member; and the two document-repair tests that pin ci/test_warm_snapshot.py as unchanged now projecting its current bytes through the newer history layers before comparing. No other inherited logic, matrix, skip or limit changes; each change is reversible through this packet's inverse authority."]
