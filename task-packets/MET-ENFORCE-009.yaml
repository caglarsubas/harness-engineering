contracts: ["Accepted base is main f4edb9afee08e52435f470cf32d2ebc4bbca384e, tree 06517f1161552cc95c4ab5d08383c31d1a0f5edc, holding 205 immutable packets including MET-ENFORCE-008 (W02c ADOPTED_DATA_CONTRACT). Add MET-ENFORCE-009 only, as packet 206. Preserve all 205 predecessor YAML files, the W01, W02a, W02g, W02b and W02c snapshots, models and verdicts, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Cause: the reviewed W01 design (HOST-INTERFACE-DRAFT-002 sections 2.1, 2.3, 4 and 5) selects SELinux domains, types and booleans and leaves the exact permission matrix to W02; its review carried finding F2 (the cgroup gate is the SELinux label check plus no CAP_DAC_READ_SEARCH, not the inability to obtain an O_PATH descriptor); the adopted W02a record leaves the role cgroup, pin and seal-marker labels and the confined backend types to W02e. W02e ranks first among ready items by roadmap score.","Add only architecture/selinux-matrix/ (matrix, vectors, readme, review brief, source index, verbatim independent review records, any reviewed-round copies and a status record), the reference evaluator scripts/selinux_matrix.py, a W02e status page, and the current master, index and owner-guide state. Owner decision E1 (a narrow BPF prog_load exception for the confined container runtime) is recorded in the status record. Every result is DATA_CHECK_ONLY: no policy module is written, compiled or loaded.","The independent review is performed by a separate agent, never the author, read-only against exact hashes, and recorded verbatim. The contract becomes ADOPTED_DATA_CONTRACT only if the final review returns PASS_FOR_SOURCE_PUBLICATION. That is not a policy module, a loaded policy, native behaviour, a selected distribution, seccomp filters or tenant acceptance.","Add one 206-packet current catalog with an exact 206-to-205 inverse before the accepted 205-to-204 MET-ENFORCE-008 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Historical source is data and is never executed.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-008 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_selinux_matrix.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 206-packet membership and count updates; the YAML corpus count 221-to-222 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the W02c layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-009 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The closed SELinux matrix (domains, types, booleans and states, rules over planeon and qualk8s objects and the security classes, deny assertions), the W02a label-slot values and the F2 closure text, with an executable evaluator and access and mutation vectors (each result pinned exactly).","The independent source-only review records bound to the exact contract bytes, and a status record with owner decision E1 whose adoption state follows only the final review.","A fresh 206-to-205 inverse authority, a validator that re-evaluates every assertion and replays every vector and checks agreement with the W02a schema, negative regressions, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
excluded: ["Product source, any SELinux policy module, compiled or loaded policy, host changes, native probes or campaigns, seccomp filters (W02d), admission allowlists (W02f), distribution selection (W03), changes to the W02a schema (W02a-F), public wire APIs, workflow and offline transport edits, installed launcher, trust or root-policy bytes, verifier code or keys, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.","Changing the W01, W02a, W02g, W02b or W02c contracts, snapshots, reviews or status records, rewriting any reviewed bytes, or claiming any E01-E12 obligation."]
