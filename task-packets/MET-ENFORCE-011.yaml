contracts: ["Accepted base is main a29c93c7813ff71eb8179c4e8611032d972e3a36, tree 2fb828b794a408b67d4fcf419526ff45d287c8df, holding 209 immutable packets including MET-ENFORCE-010. Add MET-ENFORCE-011 only, as packet 210. Preserve all 209 predecessor YAML files, every contract snapshot, review record and status record (the v1 I05 channel contract and model, the I07 policy-writer contract and model and the W01 resolution are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Add architecture/i05-gate-channel-v2/ (README, review brief, source index, channel.schema.json with $id urn:planeon:internal:effect-gate-frame:v2, outcome-mapping.json, vectors.json, the verbatim independent review record and the status record) and the reference model scripts/i05_gate_channel_v2.py, written as reviewed edits of the unchanged v1 model. v2 adds: a drain request accepted in every state and answered from the A3 fence (PENDING, then OPEN or HELD on the settling event); ARM refused DRAIN_PENDING only while DRAINING; DELETE only with a UID this execution's own CREATE 201 delivered (UID_NOT_CREATED); configurations refused when a manifest identity belongs to two runs or a run digest is unresolved; MANIFEST_REUSED for an earlier generation's digest or identity, derived from durable BIND records; every denied action reported; a failure marker on a separate failure domain, torn-record detection and a RESTARTED record, with the double-fault residual stated; the 408 exclusion, pinned Kubernetes v1.37.1 sources and the decode codes F01 and F07.","Add one 210-packet current catalog with an exact 210-to-209 inverse before the accepted 209-to-208 MET-ENFORCE-010 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes: the predecessor contracts are not changed by this packet, the frame schema is the v2 version, the mutation 4xx rows exclude 408 and the upstream sources are pinned, every vector replays through the reference model, and the contract state follows the independent review.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-010 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_i05_gate_channel_v2.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 210-packet membership and count updates; the YAML corpus count 225-to-226 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the MET-ENFORCE-010 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-011 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The independently reviewed I05 v2 contract (schema, outcome mapping, vectors, reference model, README) with its status record.","A fresh 210-to-209 inverse authority, a layer validator and test, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
