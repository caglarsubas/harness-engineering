contracts: ["Accepted base is main 8172538b80e8c73061864573e11636f18ceb9cdd, tree0a7dd35b93200dda1831a3b04d0e7bcdbeed7ed9, holding193 immutable packets including MET-VERIFY-001, merged through the owner-operated required verify check without an administrator exception. Add MET-PERF-029 only for194. Preserve all193 predecessor YAML, existing authority/index/source-lock bytes and historical attempt records. One packet, branch and PR.","Measured cause: test_credential_lifecycle.py makes55384 top-level projections; four older validators each enter the composed chain, and every composed layer rechecked the full newer chain before also delegating to a successor that rechecked it again, so the newest authority was read about12 times and the next about8 times per projection. Outer and nested suites grew about50s per packet (nested341s of420s on #147).","Composed layers MET-PERF-028, MET-LINUX-005 and MET-VERIFY-001 split their authority check into an own-authority read and the newest-first full chain. Delegating routes (historical_bytes, historical_test_bytes, current_test_bytes and, for the two newest layers, historical_catalog) call the successor route first, which freshly rechecks every newer authority, then read their own authority once and apply only their own inverse (a shared single-layer undo), so test routes no longer re-project through newer layers. The exact-predecessor fast return and authority()/fresh_authority() still recheck the complete newest-first chain. No authority byte is cached across calls, no digest is skipped except for byte-identical bytes already proven under the identical pin, and refusal messages are unchanged.","Add one194-packet current catalog with an exact194-to-193 inverse before the accepted193-to-192 MET-VERIFY-001 layer. The new projection imports no predecessor validator and rechecks its whole authority on every public route. The MET-VERIFY-001 layer is extended only to compose with this successor first. Historical source is data and never executed.","Inherit every MET-VERIFY-001 direct-argv command in order and add one validator before outer pytest:56 commands. Identical offline wrapper/environment, no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep nested420/local750/trusted900/workflow15min and32MiB outer output ceiling. No ci/ transport change, so the owner-operated verifier checks this PR.","Inherited validators, tests and documents change only by: mechanical194-packet membership/count updates; the YAML corpus count209-to-210 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-PERF-029 member; the semantic-reuse spy also observing the MET-PERF-028 own-authority entry; and the linear recheck routes above with a regression test counting exactly one read of each newer authority per route. No other inherited logic, matrix, skip or limit changes; each change is reversible through this packet's inverse authority."]
deliverables: ["Linear newest-first authority rechecks in the three composed layers with unchanged refusal semantics and a regression test proving one fresh read of every newer authority per public route.","Fresh194-to-193 inverse authority, new validator with exact-bytes authority recheck and negative regressions preserving all historical packet bytes, exact historical tests and the complete inherited suite.","Current master/index/owner-guide state recording the measured cost, the remaining per-packet growth and the separate native/tenant gates."]
