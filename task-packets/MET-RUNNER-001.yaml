contracts: ["Accepted base is exact main 945de93f89c94f42f1d63bff7997e3d0fa704fc4. Preserve all 189 predecessor YAML and every historical authority/source lock byte-for-byte; publish an exact current-first inverse for the one added packet and policy text.","The exception is external operator-controlled development CI only: one disposable Linux AMD64 guest, one job, a numeric all-in owner-approved maximum authorized exposure, conservative preflight estimate below that limit, fixed termination timestamp, automatic plus independent delete watchdog, and post-run billing review. GCP budget alerts are not hard caps. Product, tenant, runtime, live-campaign and release zero-bill admission remain unchanged; no public cloud dependency is introduced.","The sole pre-checkout execution exception is an externally installed root-owned nonwritable admission hook and narrowly scoped root-owned verifier/helper/IPC, never arbitrary sudo or shell. Its independent signed record binds exact repository ID/name, same-repository pull_request PR number, refs/pull/N/merge, head/base/merge SHA, workflow path, GITHUB_WORKFLOW_SHA against approved workflow content digest, run ID/attempt, numeric job ID observed and bound by the outside controller to the unique single-job non-matrix workflow tuple, separate GITHUB_JOB context name, packet hash against local root-custodied packet bytes, runner identity, nonce and expiry. The hook authenticates all observable tuple fields and runner identity, never invents a numeric-ID environment variable; missing or ambiguous real-hook fields block registration. workflow_dispatch is denied by default. It atomically reserves the nonce in a root-owned durable ledger and has a hard independent timeout. GITHUB_EVENT_PATH and PR title/body are untrusted, never authority. An unexpected assignment fails before checkout even if a job attempt is consumed; shared labels do not guarantee deterministic routing.","The guest is credential-free before assignment: no service account or metadata token, SSH agent, kubeconfig, provider key, Docker/container socket or billable broker. A host/VPC enforced pre-launcher egress allowlist and byte/rate ceiling limits use to GitHub and the pinned checkout action, with exact usage retained; unbounded egress blocks registration. The pinned runner has automatic update disabled. Root-owned launcher and fresh Linux isolation preflight remain mandatory after checkout; all repository code remains inside its boundary.","This packet is source-only. It does not itself approve spend, create a VM, install root policy, sign a trust bundle, register a runner, rerun/cancel CI, change a workflow, waive checks, access warm sources, or claim native Linux acceptance."]
deliverables: ["Versioned development-CI exception with numeric all-in cost authorization/estimate, fixed lifetime, one-job lifecycle, automatic and independent teardown of VM/disk/IP, usage log and post-run billing review; no billable product surface.","Root-owned exact-job pre-checkout admission contract and negative scenarios for wrong assignment, workflow_dispatch, fork, PR/ref/SHA/workflow mismatch, stale/malformed authority, replay, timeout, missing host isolation, ambient credential/broker, unbounded egress, and incomplete teardown.","190th packet catalog with reversible exact 189-packet predecessor projection and all inherited validation intact."]
excluded: ["GCP or other cloud provisioning scripts/actions, runner registration, root installation, workflow or launcher binary changes, live campaigns, product code, warm-source access, paid APIs, runtime downloads, new keys, CI waiver and tenant acceptance.","Any mutation to the 189 predecessor packet YAML, accepted authority/index/source-lock bytes or historical attempt records."]
