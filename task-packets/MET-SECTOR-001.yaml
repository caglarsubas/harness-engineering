contracts: ["Accepted base is main 2c14e512d902a44425ffeec4b1dbb54a5dbbb284, tree bec921e02eca254aba86381da649d4dbf158d54a, holding 206 immutable packets including MET-ENFORCE-009 (W02e ADOPTED_DATA_CONTRACT). Add MET-SECTOR-001 only, as packet 207. Preserve all 206 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, the unified backlog snapshot, the provider and service catalogs and historical attempt records. One packet, branch and PR.","Cause: the owner decided on October 7, 2026 that the v1.0 alpha Domain & Semantic harness uses a banking glossary and ontology, and that banking replaces white goods all the way to the first enterprise release. Twenty-eight accepted packets name white goods in immutable bytes, so the decision must be recorded as dispositions and successors rather than by editing published YAML.","Add architecture/sector-direction.json (planeon.internal.sector-direction/v1) and docs/alpha-2/SECTOR_DIRECTION.md. The record holds the decision; the banking domain-semantic scope; the fixed detection pattern; exactly one disposition for each accepted packet whose bytes match it (IND-WG-001 to IND-WG-005 and CONF-A1-001 superseded by IND-BANK-001 to IND-BANK-005 and CONF-BANK-001; CONF-A2-001 and CONF-WG-001 keeping their IDs with banking scope and needing a revised packet before dispatch; KN-DOM-001 and KN-DATA-002 with historical sector fixtures; CONF-002 as historical evidence; the rest incidental); the six unpublished successor proposals without execution authority; catalog follow-ups for a later packet; candidate regulatory inputs that assert no applicability; and non-claims that are all false.","Update the current planning state only: the master plan checkpoint, sector-pack sentence, phase rows and checklist; the scope provenance synthesis; the industry-pack, control-plane, knowledge-plane and conformance-lab repository plans; the domain-semantic, data-integration, retrieval-context and evaluation-assurance harness specifications (a sector notice ahead of their unchanged history); and the index and owner guide. White-goods build records stay as written.","Add one 207-packet current catalog with an exact 207-to-206 inverse before the accepted 206-to-205 MET-ENFORCE-009 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route; its semantic check recomputes the white-goods packet set from the exact accepted bytes and reads this packet's reviewed document bytes. Historical source is data and is never executed.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-009 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_sector_direction.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 207-packet membership and count updates; the YAML corpus count 222-to-223 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the W02e layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-SECTOR-001 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The closed sector-direction record and its page: decision SECTOR-D1, banking domain-semantic scope, one disposition per accepted packet naming white goods, six unpublished successor proposals, catalog follow-ups, candidate regulatory inputs and false non-claims.","The current master, scope, repository-plan, harness-specification, index and owner-guide text naming banking as the release sector, with white-goods build records kept as history.","A fresh 207-to-206 inverse authority, a validator that recomputes the disposition set from exact accepted bytes and checks the record, documents and untouched catalogs, negative regressions, the complete inherited suite, and required verify from the owner-operated verifier."]
excluded: ["Any banking pack, ontology, glossary terms, fixtures, provider or service catalog entry, profile, questionnaire, campaign or product source; editing any published packet YAML, the unified backlog snapshot or source index; asserting regulatory applicability; workflow and offline transport edits, installed launcher, trust or root-policy bytes, verifier code or keys, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.","Changing any contract, snapshot, review or status record, rewriting any reviewed bytes, or claiming any E01-E12 obligation."]
