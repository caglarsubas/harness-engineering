contracts: ["Standing in-roadmap source authority and current continue permit this one independently scoped source-only successor. Fresh accepted main0314a684ba637fb205856d5fb5e50206071e647a/treee94855550e977fe9e87c6016df9c2110d0f28f89 has190 immutable YAML. Add028 only for191; failed019-027 and PR144 are not accepted predecessors.","Frozen020 commit50acfd4f2cd5cc070a2dfde4c44f5aff49c8e608/treee1c0f81cf167a9066e43354705bf586dc3f5e5e0 remains unchanged. Its reserved prelaunch refusal and extra LOCAL exception are retained, not replayed or superseded by a PASS. Extra result428ada28d676274f7537f17986b37728db3ca484f81f0c245ae347861377844b records nested420.016s timeout, outer750.444s deadline,52/53 commands. Two extra outer failure identities remain unknown.","ZERO executions. Original019/020 shared2/2,020 custody exception1/1 and021/022/023/024/025/026/027 eachLOCAL1/1 are consumed at cumulativeordinal10; separatePR1443 also consumed. No packet/source/helper/review resets or transfers an allowance. Beyond the owner-directed non-acceptance dry run and profiling in the measurement contract below, no collection, selected test, benchmark, profile, diagnostic, helper, reservation, signing, activation, CI or exact-main run. A later full attempt requires independently reviewed exact-source/helper binding and explicit finite authority.","PR144/MET-LINUX-004 at614a08cfaf34ab0c37788231e03a44972f16727e is not a source donor or predecessor; LOCAL1/2/3 remain consumed. No LOCAL4, runner registration, cloud effect or transferable CI authority.","Carry forward the unaccepted019 invocation-local schema-lifecycle design as newly reviewed source, not acceptance: only validate_readiness.py::validate_packets selects/checks/constructs a validator lazily after first successful YAML load, identical SCHEMA_FORMAT_CHECKER and best_match(iter_errors(packet)) for fresh each packet. Preserve exact error rendering/continue, malformed-YAML/schema ordering, empty-loop behavior, all other checks and fresh later invocation reads. No global schema, parsed-packet or verdict cache.","The current-first191-to190 lineage module never imports/executes predecessor source. Parse and validate immutable inverse rules at import from exact code-pinned authority bytes. Each public history route and runner bridge freshly reads complete regular authority bytes with original custody/identity checks and verifies SHA, or under the028 amendment below proves byte-identity with bytes already verified under the identical pin; replace redundant full successor JSON parsing only in runner bridge entry/old-byte routes with an explicit freshness-only function. Keep old-authority refusal precedence, exact inverse/unknown-route rejection and all freshness regression obligations. Carry the narrow CI-performance semantic call-site amendment and permit only the newly specified credential-ordering snapshot decode reuse; the only additional changes are the027 two-module recipe projection amendment and the028 authority-recheck and uniqueItems amendments explicitly specified below. All other historical projection algorithms are unchanged.","Carry the unaccepted020 seven-command nested observation and mock-only regression source forward as newly reviewed code. Preserve direct argv, subprocess.run, cwd/env/capture_output/text/close_fds, timeout420, all inherited failure conditions, return codes and exception identities. Nested stdout/stderr remain buffered until completion/inner timeout; no live nested delivery claim, tee, side channel, extra process or transport change. When new structured stderr is present, bound its failed assertion payload using existing65536-byte-per-stream head/tail retention; do not echo up to20MiB of metadata through pytest traceback. Use a primitive nonzero return-code branch and explicitly raise AssertionError with the existing failure-message function. Do not use a rewriteable assert for that error payload; preserve exact unstructured legacy messages and bounded structured messages without rendering CompletedProcess. This explicit diagnostic-rendering amendment changes no pass condition or test selection.","Own root conftest.py and ci/pytest_diagnostics.py for bounded per-test setup/call/teardown START and outcome/duration events. No raw parameter values, environment, exception text, traceback locals or absolute paths in added diagnostics. Distinguish a redacted display label from a collision-resistant full-node digest. Bound each record and per-process output, explicitly mark truncation/errors; never turn failed/incomplete tests or lost required diagnostics into acceptance PASS. Fixed added-diagnostic ceilings are20MiB/process,1024bytes/record,100000records; nested stderr is summarized, never duplicated in full into the outer log. Existing32MiB outer ceiling stays unchanged.","Root pytest hooks must leave item selection/order, fixtures, skip/xfail, assertions, reports and exception semantics intact. Keep clock/sink dependencies isolated from test monkeypatching where possible, use no filesystem writes/network/threads/subprocesses, and preserve interruption. Output is diagnostic evidence only; final complete acceptance is still mandatory. Mock-only tests in tests/test_pytest_diagnostics.py do not launch pytest/subprocesses or sleep.","Retain tests/linux_runner/test_predecessor_diagnostics.py as mock-only diagnostic regression. No real subprocess/sleep/native probe. Preserve all inherited test identities and semantics, every existing negative matrix and the60 schema/lineage regression cases carried as newly reviewed source. Additional tests must prove fresh authority reads without repeat parse, rejection after second-call drift, old refusal precedence, diagnostics ordering/type/bytes/None/truncation/error preservation, unchanged seven argv and no retry.","Exactly113 allowedPaths. Carry schema-lifecycle/freshness/diagnostic/semantic/snapshot source as newly reviewed unaccepted code. Carry the027 recipe projections in validate_conformance_reference_measurement.py and validate_document_repair_plan.py unchanged. New028 optimization is confined to _checked_authority_raw of validate_packet_schema_performance.py, validate_ci_runner_admission.py and validate_unified_roadmap.py and to the uniqueItems keyword used by validate_reuse.py::_validate_schema, with their private helpers/imports. Preserve accepted authority/index/lock/YAML and019-025 failure bytes. Retain026 terminal pins; add027 terminal pins and one further nonhistorical additive test module; reconcile current documents without rewriting history.","Read/preserve predecessor packets: MET-PERF-018 SHA6b5d36d80357e09c13d224595d76367e88756f0d9eaaae8ce8e577f2203256c1; MET-RUNNER-001 SHA3a2e37117bd087275992ca62eaae0934a973e78842ce355c17668da4fb2582e8; MET-LINUX-002 SHA7e2efb3daad8e5152028cfd35ced7449cd145a51fd3573b4e71981d29a8ee787. Preserve accepted Linux test before SHA6990993b16abdd8b548e6edfba37e7c40ab6bdd10478a45ab029a3a06765c0c6, uv.lock78b80f44219e09eb34b83812d01e870edc70af2c8d6eaaa08ae26a8f45a2a7a9, pyproject3876fa86bb79bb1951b017527a83278491c21ce9f1e017e38a0558f00b89ed2b and task schema1e6d75398fb6571a1fd752b1ed597d0465c4031f9271bdda27a3075c88fb39f0 through exact source history.","Keep exactly the frozen02053 command arrays including all52 accepted MET-RUNNER-001 commands in order, no prefetch, same wrapper/closed environment. Root plugin is discovered by unchanged pytest, not command injection. Keep nested420/local750/trusted900/workflow15min,32MiB outer output ceiling, both full replays and all inherited skips. No claimed launcher speedup or adequate headroom before measured full acceptance; same-host dry-run timings are diagnostic only.","No ci/linux-runner implementation, workflow, dependency/toolchain/schema, installed root policy/launcher, keys, cloud spend/provisioning, registration, native/live campaign, warm-source observation, API/tenant isolation or tenant acceptance change. Source-only unprivileged diagnostic prints do not certify a Linux kit/host.","Before any separately granted attempt freeze exact commit/tree/packet/authority/helper, static path/history/test inventory, independent implementation/security review and finite cumulative allowance custody. Full LOCAL, exact required self-hosted CI, protected green merge and separate exact-main remain independent gates. No native dispatch/heartbeat/model/effort changes; Alpha2 open, effort NOT_DUE.","Frozen021 commit29161763f0653498c37bb80cdab291105809abed/treea6990d8354db4564cabeee389eedec5153a66685 and packet9c35ac30088f9e3914719f763e7cb7c20848d745fe2b8166fc9524ef5b6a2c71 remain unchanged. Its only LOCAL failed command2 readiness with four errors after29.908430583018344s,2/53 commands, no timeout and no pytest/diagnostic-hook/final-scan execution. Retain consumed allowance1/1, activation382, exact output/result/cleanup and independent terminal review pins. Source integrity review was not readiness PASS; no failure is erased.","Retain canonical PR-packets declaration, root tree including conftest.py and exact historical test identities. Make only028 current in owner/index/checklist; retain019-027 checkpoints as history. Repository execution during source preparation was limited to the owner-directed non-acceptance dry run and profiling outside the trusted launcher.","Before freeze, inspect all13 guides,191 physical YAML IDs/owners and ordered README using actual readiness parser boundaries. Require exact ownership, uniqueness, predecessor ordering and fenced root unions. Check raw historical AST identity consumers as well as projected-byte routes: subset preservation and reversible hashes alone are insufficient. Source observations are not collection, independent review or acceptance.","Frozen022 commitdca0163596a766efa0fabea7f1b5946daf5598cd/treecd14f167ddb0a5307302a40137affb5ae20d5f65 and packete3caf28221cce5d7b467640337c524802308fa0ccb219432f594c5c19b5ca8d3 remain unchanged. Its one LOCAL failed readiness command2 after16.44750250002835s,2/53, four historical-identity errors, no timeout or pytest. Retain activation383, consumed1/1 at cumulativeordinal5, exact output/result and independently confirmed cleanup. Earlier020 pytest failure identities remain unknown.","Restore tests/test_task_packets.py to accepted bytes except its already-declared190-to191 catalog scalar. Preserve its exact ten historical test identities/order/bodies; do not weaken equality to subset or optimize/patch older validators except the explicitly owned CI-performance call site and inherited snapshot decode projection plus the explicitly owned two027 recipe-read call sites per module and the028 authority-recheck and uniqueItems sites named in the narrow amendments below; this historical-test obligation remains unchanged. The four moved unaccepted semantic functions remain14 statically visible cases in the new module. Preserve prior021 terminal regression in its existing unaccepted module; add022 terminal/allowance regression there. New-module tests cover exact historical identity/AST preservation and reject addition/removal/rename/order/body drift with data-only fixtures. Both inherited full pytest recipes discover the new module without changed argv, hooks, skips or timeouts.","All190 accepted YAML, predecessor locks and historical authority snapshots stay byte-identical. Recompute current-first inverses and new-file hashes for the exact113-path closure. No helper, launcher, signing or acceptance execution is authorized during preparation; the owner-directed dry run is diagnostic only. Independently review exact source and security boundaries before any separately granted complete acceptance.","Frozen023 commit84f70bbb50373f77f421f5e631ff348c65f1bcda/tree0460a1dab29f51655fb43724a848ea739530d42e, packet2aa15a9b0ec348d322826377de236dd00975840b97905961a4d2d9fd80977cfa and authorityc0291cba9b13ae71fe3750d05c4f878126733d1172a4e8130ca0d57a9334abee remain unchanged. LOCAL1/1 at cumulative6 ended at750.2446481660008s, launcher-15/helper1,52/53 commands, no final scan. Nested stdout5019passed/10skipped returned1 because INVALID_NODE and4680dropped diagnostics; four outer failed call records are a lower bound, not a complete report. Independent cleanup and diagnosis reviews are retained, not PASS.","The four invalid-node fixture values and order remain unchanged, including actual65537-character input. Add explicit short non-sensitive IDs only; real pytest node IDs then stay below unchanged65536 recorder limit. No truncation-before-hash, limit increase, hook suppression, dropped evidence or skipped fixture. Preserve recorder and root-hook bytes from frozen023.","Keep frozen023 tests/linux_runner/test_predecessor_diagnostics.py byte-identical, including strict AssertionError.args, bounded stream, seven commands, failure ordering and original exception identity. Change only the nonzero failure branch in its predecessor driver; all nonzero codes still fail. Add data-only AST/source regressions in a new separately owned tests/test_diagnostic_repair.py, including rejecting fixture ID and nonzero branch drift and preserving full-suite selection. No mini-repro or subprocess tests were authorized during023 source preparation;028 preparation ran only the owner-directed full dry run and profiling.","Timing under the trusted launcher remains UNRESOLVED. Whole-test records do not prove function-level cost or sufficient headroom. This successor adds only exact-bytes authority recheck reuse in three named history layers and an exact-verdict uniqueItems keyword for validate_reuse, not generic parsed-authority or acceptance-result caching. Preserve every negative matrix, both suites, all53 commands and420/750/900s and15-minute limits.","Explicit narrow successor amendment to MET-PERF-001 no-result-reuse and024 no-older-validator-optimization restrictions: only scripts/validate_ci_performance.py imports existing validate_successor_inventory.packet_semantics through both normal direct-script/package paths and replaces canonical(safe_load(inputs[path])) with packet_semantics(inputs[path]) at its existing location. This inherited amendment changes no other CI-performance logic region; the inherited026 snapshot change has its own owner and regressions. Keep type check, full fresh historical projection/digest, semantic comparison, subsequent checks, exceptions and ordering.","Memoization is only the existing process-local exact-raw-byte keyed maxsize256 helper returning immutable canonical bytes. It is not mutable parsed-object, authorization, file-freshness or acceptance-result caching. No persistent cache, pathname/ID/digest-only key or cross-process/run reuse. Keep this existing256-entry semantic cache unchanged;026 historical decode cache stays unchanged;027's two one-entry recipe projections specified below stay unchanged;028 adds only the three one-entry (pin, exact bytes) authority records specified below. Entry count is not a total-memory bound. Leave the shared helper, safe loader, credential lifecycle logic and all inherited test bodies unchanged except exact mechanical catalog membership.","Qualification assumes unchanged pinned parser/loader/canonicalizer implementations during a process. The unchanged helper key does not detect arbitrary later parser replacement on a warm hit; do not claim that capability. Any stronger guarantee requires a separate identity-aware design. Mock parser tests must clear entries before and after, never prime production checks with mock results. Retain safe-loader Python/native parity and canonical allow_nan=False behavior.","Add tests/test_packet_semantic_reuse.py with parser/canonicalizer and both-import-path parity, distinct exact-byte keys, immutable output/decoded-mutation isolation, finite entry/eviction behavior, malformed/unsafe/nonfinite/non-byte rejection, warm-cache input/authority/map drift and exact interleaved fresh-check ordering. Do not alter or shrink any inherited test or matrix. No actual subprocess/microbenchmark/profiling/collection was authorized during024 preparation;028 preparation ran only the owner-directed dry run and profiling recorded below.","Frozen024 commit8dd222bafa295b109496827655dfbfdb1fc9fa7e/tree91d06972e4cc6a7fa9aa4828dc0154030a268723, packet4046dea8cd45a73dbb511027f29328f4953e4d487b2ec9546d9551672851680b and authority0920b5e273d6bf73be8746dde7d2e4c02df7e555813eda6133204541ccbb5b81 remain unchanged. LOCAL1/1 at cumulative7 stopped at750.2599267500336s, launcher-15/helper1,52/53, no final scan. Nested suite returned0 with COMPLETE30271records/0failed/0dropped/10skips; outer4676passed calls/0observed failed phases remained incomplete. Cleanup independently confirmed. No acceptance, CI or Linux claim.","Explicit narrow amendment to earlier no-cache/no-older-validator restrictions: only scripts/validate_credential_ordering.py::_before gains a lazy exact-raw-bytes-keyed maxsize1 immutable decoding helper. Admit only the existing290177-byte snapshot SHA5aed1292ff416c92a363ff34e0d570a152fb8029048701bd8b3fe77c69a486ff. Store only baseline string and tuple of23 string pairs; no mutable cached result or authority/acceptance verdict. Each caller receives a fresh dictionary.","Every _before call first freshly reads through unchanged regular_bytes and compares full digest against current record input pin, before lookup. Compare decoded baseline with current record after lookup every time. Noneligible data follows the exact original parse/baseline/files sequence. Eligibility is not a new acceptance restriction. Preserve exceptions, combined-error order and mutation/refusal semantics. Leave _record, pinned, shared parse, broker/native history and recipes unchanged.","The new cache is process-local and fixed-pinned-parser dependent; it does not detect arbitrary parser monkeypatching on a warm hit. Direct helper admission rejects nonbytes, wrong length/hash and mutable/incorrect projection shapes before retaining an entry. No new generic JSON cache or eager historical decoding. Mock tests must clear captured real caches before and after use.","Add tests/test_historical_snapshot_decode.py for cold/warm parser parity, fresh full reads/digests, current-record pin/baseline changes, file modification/deletion/link denial, malformed/duplicate/nonfinite/encoding/type/size fallback, exact combined-error ordering, fresh maps/immutable values, bounded admission and both import modes. Retain all inherited test bodies/identities and024/025 terminal regression bytes except exact current membership references.","Frozen0250b436e96135a3c37a4f3058bbc44876be6b26fdf/tree288049a14cebc38cfb228c63bc177a036a8a1f6c, packet5af9043ca288017452bdafc47bcd4561ad68d054087bbc0bbd51f567d1a95818 and authorityba98b54b360827284c48c309ecda1a323ac7106ce5c9dcc18158f5bd53b856d3 remain unchanged. Single LOCAL at cumulative8 timed out750.2248186670477s,52/53, no final scan; first nested command timed out420.01666895800736s. Outer3134passed and one enclosing failed call, nestedINCOMPLETE27873records/0observed failed phases are partial, not acceptance. Cleanup independently confirmed; no replay.","Narrow amendment to earlier no-older-validator/no-cache restrictions: only validate_conformance_reference_measurement.py and validate_document_repair_plan.py historical_bytes/current_test_bytes replace their local _record call with _source_projection. Add private original-reader identity, lazy decoder and immutable admission constants; preserve every other function AST, caller order, strict parser, _record, pinned, apply_recipe and all inherited tests. Leave the ordering026 AST guard and its entire core unchanged.","Each _source_projection call using the original reader freshly reads complete regular authority bytes and compares full digest against current RECORD_FILE_SHA256 before lookup. If _record was replaced or wrapped, invoke that reader exactly once, without an extra read, and return its exact result or propagate its exception. This explicit overridable-reader seam preserves duplicate-recipe and wrapper observability, never a test-name branch.","One process-local exact-raw-bytes-keyed lru_cache(maxsize=1) per named module; admit only200950bytes/SHA01b97634ff6d8d6251c68413838cadf6dd6b2079cde3794c31ec97cac46fd589 and111752bytes/SHAecd0b37b2959add14b681a646f1291e7d119f328eaf730bd850ceec761d47d2b respectively. Cache only ordered immutable recipe tuples and unchanged-test digest pairs. No full mutable parsed record, verdict, file-freshness, digest-only/pathname cache, cross-process storage or eager read at import.","Rebuild fresh nested dictionaries/lists; retain recipe order and every duplicate before-digest match rather than indexing by digest. Noneligible bytes that pass an explicitly changed current pin use the original strict parse. Preserve errors and downstream-history-before-local-read order. Fixed pinned parser stability is assumed; warm entries cannot detect arbitrary parser replacement. Mock tests clear captured actual caches before and after.","New tests/test_source_recipe_projection.py covers cold/warm parse parity, fresh full reads/digests, changed/missing/link/nonregular files, current pin changes, bounded cache admission, immutable storage/fresh returned containers, strict malformed/duplicate/nonfinite fallback, reader wrapper/exception semantics, duplicate and recipe-cardinality refusal, error ordering, both imports and exact frozen026 failure/allowance retention. No inherited tests or mutations are removed or modified except exact mechanical current packet membership.","Frozen026commit94aa7b938e2b6efb7f1e1833281541ea3a951389/tree2b28fc27de40305cb17a88bfa451c4e541c51c6a, packetcb70a0171713fd85265fbdf56176b95fba66ca9f6db4d6e55d8b25d35c9dd3f3, authority94a1f4eaf6d3c36f10311bab7f75274cfcebdf527594f950e704e783bfd81455 stay unchanged. LOCAL1/1 at cumulative9 timed out750.261581s,52/53 with final scan not reached. Nested5128passed/10skipped and7/7 commands succeeded, outer4981passed/0observed failures remained incomplete;51snapshot and42sema