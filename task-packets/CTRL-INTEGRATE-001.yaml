expectedEvidence: ["Complete predecessor Vitest suite, typecheck/build and production-route browser tests pass under deny-all outbound; preview and production modes cannot be confused.","Fresh authenticated browser-to-API-to-durable-storage evidence includes restart, transaction replay, cross-tenant RLS denial and independently authorized operator audit; PostgreSQL absence is NOT_RUN_ENV_UNAVAILABLE and blocks production readiness.","No new session/policy contract or RLS bypass is introduced; unresolved adapter or toolchain decisions stop this packet for revised authority.","Source/offline completion cannot satisfy artifact, deployment, runtime, assurance or tenant acceptance; actual installed behavior remains a separately signed CONF-A2-001 live gate.","Source coding, isolated offline acceptance, CI and merge may proceed after all remaining predecessors close; native Linux AMD64 PASS is not a source-coding prerequisite. Linux release deployment or promotion and runtime/assurance qualification require fresh, independently verified CONF-LINUX-001 foundation PASS plus native evidence bound to this product's exact source, image, toolchain, host and trust state. NOT_RUN_ENV_UNAVAILABLE never passes; ARM64 requires separate native qualification, and tenant acceptance remains independent."]
