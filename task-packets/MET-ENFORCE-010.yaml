contracts: ["Accepted base is main 51440c8de083b09e9d74fbaef3365b86d9fe89da, tree 4df04f616e212a73d8e1ec95cfe665fa53ff44ab, holding 208 immutable packets including MET-PERF-032. Add MET-ENFORCE-010 only, as packet 209. Preserve all 208 predecessor YAML files, every contract snapshot, review record and status record (the v1 and v2 native qualification contracts, the W02g identity closure and the W02e SELinux matrix are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Add architecture/native-profile-v3/ (README, review brief, source index, qualification.schema.json with $id urn:planeon:internal:native-qualification:v3, vectors.json, the verbatim independent review records and the status record) and the reference model scripts/native_qualification_v3.py, written as reviewed edits of the unchanged v2 model. v3 adds: closures that never list another role's executable or, for native-only roles, an interpreter, and an observed running image; a slice census checked against the role captures with canonical paths and listed parents; (pid, start ticks) unique over all members and backend processes; the slice's own members observed empty; per-member thread counts equal to pids.current within pids.max; test-only implementation profiles; no nested backend cgroups; backend API identities bound to the reviewed W02g closure; W02e's label values as constants; an effective-program census of the 22 other cgroup attach types of Linux v6.12, required empty; and recorded enrolled and maintenance boot entries, with every capture on the enrolled one. Migration from v2 needs a maintenance reboot and fresh nonces.","Add one 209-packet current catalog with an exact 209-to-208 inverse before the accepted 208-to-207 MET-PERF-032 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes: the predecessor contracts are not changed by this packet, the schema's label slots, backend identities and census names match W02e, the W02g closure and Linux v6.12, every vector replays through the reference model, and the contract state follows the final independent review.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-PERF-032 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_native_profile_v3.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 209-packet membership and count updates; the YAML corpus count 224-to-225 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the MET-PERF-032 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-010 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The independently reviewed v3 contract (schema, vectors, reference model, README) with its status record.","A fresh 209-to-208 inverse authority, a layer validator and test, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
