deliverables: ["Separate explicit synthetic preview composition from production composition; production overview, plane, harness and organization pages use authenticated local projections and never seed or fall back to fixture tenants.", "Connect the existing request authenticator and purpose-bound policy interfaces through typed fail-closed composition; missing identity, policy, trust or storage is unavailable/denied, never a role/header/environment allow shortcut. Changes to identity or policy contracts require separate authority.", "Implement a transactional durable adapter for projections, per-organization source cursors, event deduplication and operator audit using existing locked PostgreSQL dependencies; forced RLS, transaction-local tenant context and separately scoped operator reads remain enforced. No tenant table gets BYPASSRLS or unrestricted cross-organization grants.", "Use additive migration only; preserve prior projection/audit data and make crash-before-commit, crash-after-commit and exact replay atomic and deterministic. Pin consumed schema/release digests in contracts/status-integration.", "Run real application route/page tests with explicitly injected synthetic sessions and durable test storage, not HTML-only previews; reject cross-tenant access, stale sessions, forged sources and failed audit writes, and cover empty/unavailable states, restart/replay and clock/outage consistency.", "Add a disposable PostgreSQL integration harness using only externally preinstalled local binaries and authorized isolated storage; if absent, record NOT_RUN_ENV_UNAVAILABLE instead of a tautological pass, substituted in-memory database pass or shared-host mutation.", "Document the production-adapter selection and rollout/rollback prerequisites and hand off exact image, migration and test identifiers to CONF-A2-001 without claiming deployment or final tenant acceptance."]
