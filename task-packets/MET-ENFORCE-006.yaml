contracts: ["Accepted base is main 46bcc3e383ec5d9cf0c0d722636d264942b435de, tree c6762dbb056be473846dbdfb01817e8d9f3deffc, holding 201 immutable packets including MET-ENFORCE-005 (W02a ADOPTED_DATA_CONTRACT). Add MET-ENFORCE-006 only, as packet 202. Preserve all 201 predecessor YAML files, the W01 and W02a snapshots and verdicts, the W02a schema and reference model, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Cause: W01 selected a sealed single-node Kubernetes control plane as the I06 policy backend (spec section 2.1, P1-P10) and left the selection criteria, the autonomous-writer list and the exact identity closure to W02. W01 review finding F1 requires the apiserver loopback identity and the rbac/bootstrap-roles reconciler to be enumerated. W02a finding P7 requires the unit-distribution profile to be marked test-only. W02g ranks next by roadmap score.","Add only architecture/i06-backend-profile/ (criteria, writer inventory, identity closure, upstream bootstrap RBAC and facts cited from Kubernetes v1.37.1, vectors, readme, review brief, source index, verbatim independent review records, reviewed-round copies and a status record), the reference model scripts/i06_backend_profile.py, a W02g status page, and the current master, index and owner-guide state. Every vector and model result is DATA_CHECK_ONLY: no cluster is observed or installed and no distribution is selected.","The independent review is performed by a separate agent, never the author, read-only against exact hashes, and recorded verbatim. The contract becomes ADOPTED_DATA_CONTRACT only if the final review returns PASS_FOR_SOURCE_PUBLICATION. F1 and P7 are CLOSED only if that review confirms them. Neither outcome is a selected distribution, an observed cluster, native qualification or tenant acceptance.","Add one 202-packet current catalog with an exact 202-to-201 inverse before the accepted 201-to-200 MET-ENFORCE-005 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Historical source is data and is never executed.","Inherit every MET-ENFORCE-005 direct-argv command in order and add one validator before the outer pytest, for 64 commands. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 202-packet membership and count updates; the YAML corpus count 217-to-218 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the W02a layer's subject check adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-006 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["Selection criteria SC00-SC15 for a distribution evidence record; a writer inventory projecting the cited upstream facts; an identity closure whose upstream entries equal the grants derived from the upstream bootstrap RBAC; RBAC-snapshot rules IC00-IC05; executable vectors, each negative pinned to its exact refusal; and a DATA_CHECK_ONLY reference model.","The independent source-only review records bound to the exact contract bytes, and a status record whose adoption, F1 and P7 states follow only the final review.","A fresh 202-to-201 inverse authority, a validator that replays every vector, negative regressions, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
excluded: ["Product source, public wire APIs or CRDs, installed profiles, Kubernetes installations or observations, a selected distribution, host policies, SELinux modules, the I05 and I07 wire schemas, syscall allowlists, the SELinux permission matrix and admission allowlists (other W02 parts), workflow and offline transport edits, installed launcher, trust or root-policy bytes, verifier code or keys, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.","Changing the W01 or W02a contracts, snapshots, reviews or status records, rewriting any reviewed bytes, or claiming any E01-E12 obligation."]
