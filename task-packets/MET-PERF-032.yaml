contracts: ["Accepted base is main 8f77c3ff5289bade9752f2a3200645180f473e13, tree ed9f92d165df5211387e7024c05ea4f644ce8348, holding 207 immutable packets including MET-SECTOR-001. Add MET-PERF-032 only, as packet 208. Preserve all 207 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Cause: required verify grew 545 s, 554 s, 639 s, 692 s over packets 204-207. A per-test profile of the 206-packet suite (Mac pytest 495 s) shows the cost spread over the history chain, with four removable repeats: the route tests in the composed layer files (36 s, growing quadratically with each new layer), tests/test_native_profile_v2.py::test_contract_status_cannot_overclaim (14 s), the inventory() builder in tests/test_credential_lifecycle.py (about 15 s) and jsonschema's uniqueItems over the reuse path index in scripts/validate_readiness.py (4.2 s per run, run three times per verify).","Route tests: in test_newest_authority_is_freshly_checked_on_every_route of every composed layer test, each setup value other than the shared path, raw and master_raw reads becomes `value if route selects it else None`, where the selected routes are exactly the routes whose call reads that value. Each route still computes its own input before the authority read changes, makes the same positive call, and must raise the same newest-authority digest refusal.","Status mutations: each case stubs only validate_vectors, a pure replay that reads no status bytes, then proves under the same stub that the unchanged status passes before the changed status must be refused. test_every_vector_replays_to_its_pinned_result keeps running the replay and the full validator unstubbed.","Inventory builder: projected_inputs computes the history projection once per exact set of (path, bytes) inputs per test module and gives each caller its own mapping. It only prepares arguments for validate_inventory; validate_credential_lifecycle and every other validator still project afresh. No validator caches a projection or verdict.","uniqueItems: new scripts/schema_unique.py extends Draft 2020-12 with one keyword, uniqueItems, that keeps jsonschema 4.24.0's sorted path unchanged and, where items do not sort, compares with jsonschema's own equal only items that share an equality key (equal values always share it). Arrays holding anything but plain JSON, nested deeper than 100 levels (a cycle always is) or whose grouping exceeds the recursion limit keep jsonschema's own check, so the result is jsonschema's answer wherever jsonschema returns one; only where jsonschema itself would exceed the recursion limit may it differ. validate_readiness.validate_schema_instance builds that validator; the condition and message are unchanged.","Add one 208-packet current catalog with an exact 208-to-207 inverse before the accepted 207-to-206 MET-SECTOR-001 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes: every route test is route-local, computes nothing inside its calls and keeps the shared refusal tail; the status test and the inventory helper are exactly as described; the stubbed replay and its model read no files; and the reviewed scripts/schema_unique.py, run against the installed jsonschema (required to be 4.24.0), differs from Draft 2020-12 only in uniqueItems and gives jsonschema's own answer on a fixed corpus of 4,026 arrays that reaches every comparison path.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-SECTOR-001 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_verify_headroom.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 208-packet membership and count updates; the YAML corpus count 223-to-224 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the MET-SECTOR-001 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-PERF-032 member; the four changes above; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["Route-local setup in every composed layer route test, the stubbed status replay with a positive control, the shared exact inventory projection, and scripts/schema_unique.py used by the readiness validator.","A fresh 208-to-207 inverse authority, a layer validator and test, the complete inherited suite, and the current master, index and owner-guide state; before-and-after timings; required verify from the owner-operated verifier."]
excluded: ["Product source, any change to what a validator accepts or refuses, any projection or verdict cache inside scripts/, workflow and offline transport edits, installed launcher, trust or root-policy bytes, verifier code or keys, acceptance argv changes, timeout changes, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.","Changing any contract, snapshot, review or status record, rewriting any reviewed bytes, or claiming any E01-E12 obligation."]
