expectedEvidence: ["Legal/illegal task transition coverage.","Cross-role and cross-tenant denial plus offline service-shell startup.","Negative Make-dispatch vectors reject missing, unknown, or duplicate targets; owner or filename mismatch; undeclared variables; shell transport; and zero or ambiguous applicable handlers.","PORTING bootstrap validation proves zero authorized source mappings and rejects any copy claim without a future approved PORT_CANDIDATE packet.","Source coding, isolated offline acceptance, CI and merge may proceed after all remaining predecessors close; native Linux AMD64 PASS is not a source-coding prerequisite. Linux release deployment or promotion and runtime/assurance qualification require fresh, independently verified CONF-LINUX-001 foundation PASS plus native evidence bound to this product's exact source, image, toolchain, host and trust state. NOT_RUN_ENV_UNAVAILABLE never passes; ARM64 requires separate native qualification, and tenant acceptance remains independent."]
rollback: Revert the unconsumed execution foundation and initial additive migrations.
