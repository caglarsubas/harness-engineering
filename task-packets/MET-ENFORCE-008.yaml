contracts: ["Accepted base is main f94229a7c81c39016d83213bb17cce8c6f862c65, tree 8c606790f7d6d458251698275988adbc61e4d892, holding 204 immutable packets including MET-ENFORCE-007 (W02b ADOPTED_DATA_CONTRACT) and MET-PERF-031. Add MET-ENFORCE-008 only, as packet 205. Preserve all 204 predecessor YAML files, the W01, W02a, W02g and W02b snapshots, models and verdicts, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Cause: the reviewed W01 design (HOST-INTERFACE-DRAFT-002 sections 2.3, 2.4, 3.2 and 4.3) left the exact I07 schema, the closed policy-kind set and its refusal vectors to W02, and the W02b round-3 review carried finding P1 (a drain reply after an urgent close is not the A3 fence) to W02c. The gate cannot mediate policy writes (G04) without it. W02c ranks first among ready items by roadmap score.","Add only architecture/i07-policy-write/ (frame schema, policy-kind table, vectors, readme, review brief, source index, verbatim independent review records, any reviewed-round copies and a status record), the reference model scripts/i07_policy_write.py, a W02c status page, and the current master, index and owner-guide state. The W02b model scripts/i05_gate_channel.py is imported unchanged. Every vector and model result is DATA_CHECK_ONLY: no socket is opened, nothing is forwarded or installed.","The independent review is performed by a separate agent, never the author, read-only against exact hashes, and recorded verbatim. The contract becomes ADOPTED_DATA_CONTRACT only if the final review returns PASS_FOR_SOURCE_PUBLICATION. That is not an installed gate or writer, native custody, a selected HTTP/TLS client, the A2 policy objects, a fix of the I05-side P1 bookkeeping or tenant acceptance.","Add one 205-packet current catalog with an exact 205-to-204 inverse before the accepted 204-to-203 MET-PERF-031 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Historical source is data and is never executed.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-PERF-031 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_i07_policy_write.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 205-packet membership and count updates; the YAML corpus count 220-to-221 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the PERF-031 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-008 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The closed I07 frame schema and envelope rules, the closed policy-kind table derived from the W02g writer grants, and an executable gate model with kind-table, rendering, outcome, frame and transcript vectors (each output pinned exactly).","The independent source-only review records bound to the exact contract bytes, and a status record whose adoption state follows only the final review.","A fresh 205-to-204 inverse authority, a validator that replays every vector and recomputes the table, negative regressions, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
excluded: ["Product source, the gate or writer implementation, any socket, HTTP/TLS client or installed state, native probes or campaigns, the A2 policy objects (W02f), changes to the I05 contract or model (W02b-F), public wire APIs, workflow and offline transport edits, installed launcher, trust or root-policy bytes, verifier code or keys, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.","Changing the W01, W02a, W02g or W02b contracts, snapshots, reviews or status records, rewriting any reviewed bytes, or claiming any E01-E12 obligation."]
