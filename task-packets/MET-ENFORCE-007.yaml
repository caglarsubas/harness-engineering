contracts: ["Accepted base is main fe50b57c0e6b6d5e5732b1b346bbad8727959a6f, tree db8c1a62e7e181dbf1f303b9a1e8f84dd0494ffd, holding 202 immutable packets including MET-ENFORCE-006 (W02g ADOPTED_DATA_CONTRACT). Add MET-ENFORCE-007 only, as packet 203. Preserve all 202 predecessor YAML files, the W01, W02a and W02g snapshots and verdicts, the I02 broker channel schema and protocol, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Cause: the reviewed W01 design (HOST-INTERFACE-DRAFT-002 sections 3.2, 6 and 7) left the exact I05 key types, enum values, transcript directions, size limits, duplicate and replay vectors and the outcome-to-RESOURCE_RESULT mapping to W02, to be versioned together. The gate (W03) and the broker changes cannot be built without it, and I07 (W02c) reuses its envelope. W02b ranks first among ready items by roadmap score.","Add only architecture/i05-gate-channel/ (frame schema, outcome mapping, vectors, readme, review brief, source index, verbatim independent review records, reviewed-round copies and a status record), the reference model scripts/i05_gate_channel.py, a W02b status page, and the current master, index and owner-guide state. Every vector and model result is DATA_CHECK_ONLY: no socket is opened, nothing is forwarded or installed. I02 is not extended and none of its enums is overloaded.","The independent review is performed by a separate agent, never the author, read-only against exact hashes, and recorded verbatim. The contract becomes ADOPTED_DATA_CONTRACT only if the final review returns PASS_FOR_SOURCE_PUBLICATION. That is not an installed gate, native stamping, a selected HTTP/TLS substrate, the I07 schema or tenant acceptance.","Add one 203-packet current catalog with an exact 203-to-202 inverse before the accepted 202-to-201 MET-ENFORCE-006 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Historical source is data and is never executed.","The installed activation authority admits at most 64 acceptance commands, the trusted verifier requires every command of the newest accepted packet in order, and MET-ENFORCE-006 already has 64. Inherit all 64 MET-ENFORCE-006 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_i05_gate_channel.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 203-packet membership and count updates; the YAML corpus count 218-to-219 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the W02g layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-007 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The closed I05 frame schema and envelope rules, an executable gate model with transcript, replay and duplicate vectors (each output pinned exactly), and the ACTION_OUTCOME to RESOURCE_RESULT mapping table with agreement vectors.","The independent source-only review records bound to the exact contract bytes, and a status record whose adoption state follows only the final review.","A fresh 203-to-202 inverse authority, a validator that replays every vector, negative regressions, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
excluded: ["Product source, the gate or broker implementation, any socket, HTTP/TLS substrate or installed state, native probes or campaigns, the I07 wire schema (W02c), changes to the I02 channel schema or protocol, public wire APIs, workflow and offline transport edits, installed launcher, trust or root-policy bytes, verifier code or keys, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.","Changing the W01, W02a or W02g contracts, snapshots, reviews or status records, rewriting any reviewed bytes, or claiming any E01-E12 obligation."]
