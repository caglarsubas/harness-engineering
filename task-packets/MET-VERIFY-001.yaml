contracts: ["Accepted base is main e4e0bebc77737d99a32aedee7916f36a3906c3bd, tree09d15480bc566ac4238e7d61d92967896f9422e7, holding192 immutable packets including MET-LINUX-005. Add MET-VERIFY-001 only for193. Preserve all192 predecessor YAML, existing authority/index/source-lock bytes and historical attempt records. One packet, branch and PR.","PR #145 (MET-PERF-028) and PR #146 (MET-LINUX-005) were merged under two consumed one-time administrator exceptions after independently confirmed LOCAL_PASS_ONLY results, because the required verify check had no runner. Those exceptions are consumed, not reusable, and transfer no allowance.","Document the owner decision of October3, 2026: the required check named verify on main is pinned to the owner's GitHub App harness-onion-verify (App ID5175550, Checks write, Pull requests read, Metadata read, installed only on this repository). The offline-readiness workflow file stays byte-identical but is disabled; no hosted runner and no GitHub-hosted minutes are used.","The owner-operated verifier is external operator infrastructure outside this repository. For each same-repository, non-draft PR into main it verifies the exact head once, never retries automatically, requires the branch to contain main, requires exactly one added task packet that keeps every command of the newest accepted packet in order, and refuses PRs changing the offline transport under ci/ except top-level ci/test_*.py and ci/linux-runner/, which need the operator LOCAL path.","Execution authority is a separate narrow activation key accepted by the installed authority only for repository Harness-Engineering and profile python-meta with lifetime at most1800s; the operator key path is unchanged. The installed launcher sandbox additionally denies LaunchServices opens, Apple Events, launchd job creation and exec of open, osascript, osacompile, launchctl, crontab, at, batch, automator, shortcuts and lsappinfo. Root changes, keys and probes are owner-installed operator records, not repository source.","Evidence states stay separate: a verify success is a PR check on the macOS trusted offline launcher only; it is not native Linux qualification, exact-main, installed Linux host, runtime or tenant acceptance. A GCP Linux verifier is a later, separately approved successor; this packet authorizes no cloud provisioning or spending.","Add one193-packet current catalog with an exact193-to-192 inverse before the accepted192-to-191 MET-LINUX-005 layer. The new projection imports no predecessor validator and rechecks its whole authority on every public route. The MET-LINUX-005 layer is extended only to compose with this successor first, as it composes the MET-PERF-028 layer. Historical source is data and never executed.","Inherit every MET-LINUX-005 direct-argv command in order and add one validator before outer pytest:55 commands. Identical offline wrapper/environment, no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep nested420/local750/trusted900/workflow15min and32MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical193-packet membership/count updates; the YAML corpus count208-to-209 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests adjusted solely for the successor bridge; and catalog-membership filters ignoring only the added MET-VERIFY-001 member. No other inherited logic, matrix, skip or limit changes; each change is reversible through this packet's inverse authority."]
