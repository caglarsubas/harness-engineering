wo public functions) and readiness's catalog semantics on the effective catalogs.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-PERF-036 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_sector_catalog.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: the overlay, its module and records and the R11 notice above; mechanical 218-packet membership and count updates; the YAML corpus count 233-to-234 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the MET-PERF-036 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-SECTOR-002 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
