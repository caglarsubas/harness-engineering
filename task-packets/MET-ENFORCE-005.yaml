ical source is data and never executed.","Inherit every MET-ENFORCE-004 direct-argv command in order and add one validator before outer pytest:63 commands. Identical offline wrapper environment, no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep nested420/local750/trusted900/workflow15min and32MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical201-packet membership/count updates; the YAML corpus count216-to-217 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the W01 layer's predecessor-input check adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-005 member; and the current-state text. No other inherited logic, matrix, skip or limit changes; each change is reversible through this packet's inverse authority."]
