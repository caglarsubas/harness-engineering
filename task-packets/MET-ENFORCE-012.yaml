contracts: ["Accepted base is main 487eca6809eca9fd5b2647f79522d107dee8d814, tree b047a6ba11fabe0a0d58586268bd0608a7b841a7, holding 210 immutable packets including MET-ENFORCE-011. Add MET-ENFORCE-012 only, as packet 211. Preserve all 210 predecessor YAML files, every contract snapshot, review record and status record (the I06 v1 profile, its identity closure, writer inventory and upstream inputs, the v1 model, and the W02a v2 and v3 contracts and models are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Add architecture/i06-backend-profile-v2/ (README, review brief, source index, criteria.json with SC00, SC08 and IC03 restated, vectors.json, the three verbatim independent review records with the reviewed bytes of rounds 1 and 2 under round1/ and round2/, and the status record) and the reference model scripts/i06_backend_profile_v2.py, which reuses the unchanged v1 model and W02a v3's check_record. v2 adds: an evidence field w02aRecord naming one W02a v3 record by qualificationDigest; check_record acceptance of that record; equal identity and test-only state; a test-only backend only in an explicit fixture call; I06's own code distinctness rule pinned with backends W02a accepts; and no resource rule on User system:apiserver. Every v1 evidence and snapshot negative is replayed, with the ten changed refusals pinned.","Add one 211-packet current catalog with an exact 211-to-210 inverse before the accepted 210-to-209 MET-ENFORCE-011 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes: the predecessor contracts are not changed by this packet, the criteria change exactly SC00, SC08 and IC03, every vector replays through the reference model, every v1 case is replayed or moved, and the contract state follows the independent review.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-011 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_i06_backend_profile_v2.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 211-packet membership and count updates; the YAML corpus count 226-to-227 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the MET-ENFORCE-011 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-012 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
