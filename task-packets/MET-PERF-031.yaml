contracts: ["Accepted base is main b46446d36528db91c31bf4b77a6523cb555a3332, tree fe0e1e8bd553df983d801ce8c0d67187f3131ed4, holding 203 immutable packets including MET-ENFORCE-007 (W02b ADOPTED_DATA_CONTRACT). Add MET-PERF-031 only, as packet 204. Preserve all 203 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Cause: required verify grew 553 s, 605 s, 626 s, 786 s over packets 200-203 against the trusted 900 s cap. A per-test profile of the 203-packet suite shows three loops costing 162 s of 569 s of pytest on the Mac: tests/test_credential_lifecycle.py::test_every_input_pin_is_enforced, ::test_performance_predecessor_and_exact_twenty_commands and tests/test_ci_performance.py::test_each_protected_input_rechecked_not_cached. Each repeats the full history projection of identical unchanged inputs, so its cost grows with the number of inputs times the chain depth.","Change only those three tests, through one test-local helper share_exact_projections in each of the two files. For the duration of one test the helper replaces one projection name in the validator module (historical_bytes, and in the packet-variant loop also expected_current_test_source) with a wrapper keyed by the exact arguments (bytes and strings as given, dictionaries as canonical JSON): an input not yet seen calls the real projection, an identical repeat returns that real result. Every mutated input is new and is projected fresh, so each loop still proves that every pin or packet field refuses on its own. Each test undoes the wrapper and then runs a fully fresh validation. No validator under scripts/ shares projections.","Add one 204-packet current catalog with an exact 204-to-203 inverse before the accepted 203-to-202 MET-ENFORCE-007 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Historical source is data and is never executed.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-007 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_projection_reuse.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 204-packet membership and count updates; the YAML corpus count 219-to-220 in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the W02b layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-PERF-031 member; the three projection-sharing loops above; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The three loops with test-local exact projection sharing, each still validating every mutation and ending with a fresh validation.","A fresh 204-to-203 inverse authority, a layer validator and test, the complete inherited suite, and the current master, index and owner-guide state; before-and-after timings; required verify from the owner-operated verifier."]
